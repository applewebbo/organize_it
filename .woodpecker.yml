when:
  branch:
  - main
  event: push

steps:
- name: test
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  commands:
      # Install gettext (compilemessages) + WeasyPrint runtime libs
  - apt-get update -qq && apt-get install -y -qq gettext libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libfontconfig1 libffi8 libglib2.0-0

      # Install dependencies
  - uv sync

      # Compile translation files
  - ENVIRONMENT=test uv run python manage.py compilemessages

      # Run tests (excluding mapbox tests that require external API)
  - ENVIRONMENT=test uv run pytest -n 8 --reuse-db --dist loadscope --exitfirst -m "not mapbox"
  environment:
    SECRET_KEY: test-secret-key-for-ci
    ENVIRONMENT: test
    UV_LINK_MODE: copy
    MAPBOX_ACCESS_TOKEN:
      from_secret: MAPBOX_ACCESS_TOKEN

- name: deploy-docs
  image: python:3.14-slim
  commands:
      # Install git and dependencies
  - apt-get update -qq && apt-get install -y -qq git

      # Install mkdocs dependencies
  - pip install -q -r docs/requirements.txt

      # Build EN and IT docs
  - mkdocs build -f mkdocs.yml -d site-en
  - mkdocs build -f mkdocs-it.yml -d site-it

      # Assemble into pages/ directory
  - mkdir -p pages/en pages/it
  - cp -r site-en/. pages/en/
  - cp -r site-it/. pages/it/
  - |
    cat > pages/index.html <<'EOF'
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8">
      <meta http-equiv="refresh" content="0; url=en/">
      <link rel="canonical" href="en/">
    </head>
    <body>
      <p>Redirecting to <a href="en/">English docs</a>...</p>
    </body>
    </html>
    EOF

      # Deploy to pages branch
  - git config user.name "Woodpecker CI"
  - git config user.email "ci@woodpecker"
  - git remote set-url origin https://oauth2:$FORGEJO_TOKEN@codeberg.org/webbografico/organize_it.git
  - git checkout --orphan pages-deploy
  - git rm -rf . --quiet
  - cp -r pages/. .
  - git add .
  - "git commit -m 'docs: deploy to Codeberg Pages'"
  - git push --force origin HEAD:pages
  environment:
    FORGEJO_TOKEN:
      from_secret: FORGEJO_TOKEN
  depends_on:
  - test
