name: Docs

on:
  push:
    branches: [main]
    paths:
    - docs/**
    - mkdocs.yml
    - mkdocs-it.yml
    - .github/workflows/docs.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs (EN + IT)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Build English and Italian docs
      run: |
        uv run --group docs mkdocs build -f mkdocs.yml -d site/en
        uv run --group docs mkdocs build -f mkdocs-it.yml -d site/it

    - name: Add root redirect to English docs
      run: |
        cat > site/index.html <<'EOF'
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=en/">
          <link rel="canonical" href="en/">
        </head>
        <body>
          <p>Redirecting to <a href="en/">English docs</a>...</p>
        </body>
        </html>
        EOF

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4
