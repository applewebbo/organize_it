site_name: Organize It Documentazione
site_url: https://applewebbo.github.io/organize_it/it/
repo_url: https://github.com/applewebbo/organize_it
repo_name: organize_it
edit_uri: edit/main/docs/it/

theme:
  name: material
  language: it
  custom_dir: docs/overrides-it
  palette:
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Passa alla modalità scura
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-4
      name: Passa alla modalità chiara
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.tracking
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.action.edit

extra_css:
- assets/stylesheets/daisyui-theme.css

docs_dir: docs/it

plugins:
- search

nav:
- Home: index.md
- Per Iniziare:
  - Installazione: getting-started/installation.md
  - Guida Rapida: getting-started/quick-start.md
  - Il Tuo Primo Viaggio: getting-started/first-trip.md
- Guida Utente:
  - Viaggi: user-guide/trips.md
  - Procedura Guidata: user-guide/wizard.md
  - Giorni: user-guide/days.md
  - Alloggi: user-guide/stays.md
  - Esperienze: user-guide/experiences.md
  - Pasti: user-guide/meals.md
  - Suggerimenti AI: user-guide/suggestions.md
  - Trasferimenti: user-guide/transfers.md
  - Spese Condivise: user-guide/expenses.md
  - Checklist: user-guide/checklist.md
  - Documenti e Allegati: user-guide/attachments.md
  - Esportazione e Calendario: user-guide/export.md
  - Meteo: user-guide/weather.md
  - Collaborazione: user-guide/collaboration.md
  - Installazione e Offline: user-guide/pwa.md
- Domande Frequenti: faq.md

markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- attr_list
- md_in_html
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
