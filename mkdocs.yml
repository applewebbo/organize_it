site_name: Organize It Documentation
site_url: https://webbografico.codeberg.page/organize_it/en/
repo_url: https://codeberg.org/webbografico/organize_it
repo_name: organize_it
edit_uri: edit/main/docs/en/

theme:
  name: material
  language: en
  custom_dir: docs/overrides-en
  palette:
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.tracking
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.action.edit

extra_css:
- assets/stylesheets/daisyui-theme.css

docs_dir: docs/en

plugins:
- search

nav:
- Home: index.md
- Getting Started:
  - Installation: getting-started/installation.md
  - Quick Start: getting-started/quick-start.md
  - Your First Trip: getting-started/first-trip.md
- User Guide:
  - Trips: user-guide/trips.md
  - Days: user-guide/days.md
  - Stays: user-guide/stays.md
  - Experiences: user-guide/experiences.md
  - Meals: user-guide/meals.md
  - Transfers: user-guide/transfers.md
  - Checklist: user-guide/checklist.md
  - Documents & Attachments: user-guide/attachments.md
  - Export & Calendar Sync: user-guide/export.md
  - Weather: user-guide/weather.md
  - Collaboration: user-guide/collaboration.md
- FAQ: faq.md

markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- attr_list
- md_in_html
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
