{% load i18n %}
{% if found %}
    <div class="mt-2 mb-4">
        <ul>
            {% for place in places %}
                <li class="mx-2 mb-2 flex items-center justify-between gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-600"
                    data-address="{{ place.address }}"
                    data-lat="{{ place.lat }}"
                    data-lng="{{ place.lng }}">
                    <div>
                        <span class="font-bold">{{ place.name }}</span>&nbsp;<span>{{ place.address }}</span>
                    </div>
                    <button type="button"
                            class="btn btn-xs btn-ghost"
                            @click="selectAddress('{{ place.address|escapejs }}', '{{ place.lat }}', '{{ place.lng }}')">
                        <i class="ph-bold ph-plus-circle i-sm"></i>
                    </button>
                </li>
            {% endfor %}
        </ul>
        <p class="mx-2 my-1 flex items-center justify-end gap-1 px-3 text-xs text-slate-400 italic">
            <i class="ph-bold ph-info i-xs"></i>{% trans 'Powered by' %}&nbsp;<a href="https://maps.google.com" class="link link-primary">Google Places</a>
        </p>
    </div>
{% endif %}
