{% load i18n %}
{# Kind selector: no box checked means "all kinds". #}
<div class="mb-2 flex flex-wrap gap-x-3 gap-y-1 text-xs">
    <label class="flex cursor-pointer items-center gap-1.5">
        <input type="checkbox"
               name="kinds"
               value="experience"
               class="checkbox checkbox-xs checkbox-success"
               checked />
        <i class="ph-bold ph-map-pin i-xs text-green-500"></i>
        {% translate 'Experiences' %}
    </label>
    <label class="flex cursor-pointer items-center gap-1.5">
        <input type="checkbox"
               name="kinds"
               value="meal"
               class="checkbox checkbox-xs checkbox-warning"
               checked />
        <i class="ph-bold ph-fork-knife i-xs text-yellow-500"></i>
        {% translate 'Meals' %}
    </label>
    <label class="flex cursor-pointer items-center gap-1.5">
        <input type="checkbox"
               name="kinds"
               value="stay"
               class="checkbox checkbox-xs checkbox-info"
               checked />
        <i class="ph-bold ph-bed i-xs text-sky-500"></i>
        {% translate 'Stays' %}
    </label>
</div>
