{% load i18n %}
<div class="p-4 sm:p-6" x-data="{ strategy: '{{ strategy|default:'add' }}' }">
    <div class="mb-4 flex items-center justify-between">
        <h3 class="text-lg font-semibold">
            {% translate 'Plan the day' %}
            <span class="text-base-content/50 font-normal">— {{ day.date|date:"j F" }}</span>
        </h3>
        <button type="button"
                @click="$dispatch('hide-modal')"
                class="btn btn-sm btn-circle btn-ghost"
                aria-label="{% translate 'Close' %}"><i class="ph-bold ph-x i-md"></i></button>
    </div>
    <div id="plan-day-top">{% include 'suggestions/plan-day-top.html' %}</div>
    <div id="plan-day-results" class="mt-4 max-h-96 overflow-y-auto">
        {% if stops %}
            {% include 'suggestions/plan-day-results.html' %}
        {% endif %}
    </div>
</div>
