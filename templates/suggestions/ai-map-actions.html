{% load i18n %}
<div class="flex gap-2">
    {% if has_cache %}
        <button type="submit"
                name="refresh"
                value="1"
                class="btn btn-sm btn-secondary flex-1">
            <i class="ph-bold ph-arrows-clockwise i-sm htmx-hide-on-request"></i>
            <span id="ai-spinner"
                  class="loading loading-spinner loading-xs htmx-indicator"></span>
            {% translate 'Regenerate' %}
        </button>
    {% else %}
        <button type="submit" class="btn btn-sm btn-secondary flex-1">
            <i class="ph-bold ph-sparkle i-sm htmx-hide-on-request"></i>
            <span id="ai-spinner"
                  class="loading loading-spinner loading-xs htmx-indicator"></span>
            {% translate 'Generate' %}
        </button>
    {% endif %}
</div>
<p class="text-base-content/50 mt-1 text-xs">{% translate 'Generating uses your AI provider quota.' %}</p>
