<div x-data="{ openModal: false }"
     x-cloak
     @open-modal.window="openModal = true; document.getElementById('dialog').innerHTML = '<div class=\'flex justify-center items-center h-64\'><span class=\'loading loading-spinner loading-lg text-primary\'></span></div>';"
     @hide-modal.window="openModal = false; setTimeout(() => document.getElementById('dialog').innerHTML = '', 300);">
    <div x-show="openModal"
         x-on:keydown.escape.prevent.stop="openModal = false"
         role="dialog"
         aria-modal="true"
         x-id="['modal-title']"
         :aria-labelledby="$id('modal-title')"
         class="fixed inset-0 z-50 overflow-y-auto">
        <!-- Overlay -->
        <div x-show="openModal"
             x-transition.opacity
             class="fixed inset-0 bg-black/50"></div>
        <!-- Panel -->
        <div x-show="openModal"
             x-transition
             class="relative flex min-h-screen items-center justify-center p-4">
            <div x-on:click.stop
                 x-trap.noscroll.inert="openModal"
                 id="dialog"
                 class="relative w-full max-w-2xl overflow-y-auto rounded-lg bg-white shadow dark:bg-slate-600"></div>
        </div>
    </div>
</div>
