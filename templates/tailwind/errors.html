{% if form.non_field_errors %}
    <div class="mb-4 w-full">
        {% if form_error_title %}
            <div class="rounded-t bg-red-500 px-4 py-2 font-bold text-white">{{ form_error_title }}</div>
        {% endif %}
        <div class="rounded-b border border-red-400 bg-red-100 px-4 py-3 text-red-700">
            <ul>
                {{ form.non_field_errors|unordered_list }}
            </ul>
        </div>
    </div>
{% endif %}
