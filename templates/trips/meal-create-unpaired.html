{% load crispy_forms_tags i18n %}
<form hx-post="{{ request.path }}"
      hx-target="#dialog"
      hx-disabled-elt="#form-submit"
      class="modal-content"
      method="post"
      x-data="autocompleteForm()">
    <div class="border-base-300 flex items-center justify-between rounded-t border-b p-4 md:px-5 md:py-2.5">
        <h3 class="text-xl font-semibold text-gray-900 dark:text-white">{% trans 'Create a new Meal' %}</h3>
        <button type="button"
                class="ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white"
                x-on:click="openModal = false">
            <i class="ph-bold ph-x i-md"></i>
            <span class="sr-only">Close modal</span>
        </button>
    </div>
    <div class="grid gap-x-1 p-4 sm:grid-cols-4 sm:gap-x-2 md:p-5">
        {% csrf_token %}
        {% if stages|length > 1 %}
            <div class="mb-3 sm:col-span-4">
                <label class="mb-1 block text-sm font-medium">{% trans 'Stage' %}</label>
                <select class="select select-bordered select-sm w-full"
                        @change="$refs.city.value = $event.target.value; $refs.city.dispatchEvent(new Event('input'))">
                    <option value="">{% trans '— no stage —' %}</option>
                    {% for stage in stages %}<option value="{{ stage.destination }}">{{ stage.destination }}</option>{% endfor %}
                </select>
            </div>
        {% endif %}
        {% crispy form %}
    </div>
    <div class="flex items-center justify-end p-4 md:p-5">
        <button type="button"
                x-on:click="openModal = false"
                class="btn btn-outline btn-error mr-2">{% trans 'Cancel' %}</button>
        <button id="form-submit" class="btn btn-outline btn-primary" type="submit">{% trans 'Save' %}</button>
    </div>
</form>
