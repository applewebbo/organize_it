{% load i18n %}
{% if duration_minutes %}
    <div class="border-base-300 bg-base-200 text-base-content/80 mt-2 flex items-center gap-2 rounded-md border px-3 py-2 text-sm">
        <i class="ph-bold ph-car-profile i-sm text-base-content/60 shrink-0"
           aria-hidden="true"></i>
        <span>
            {% translate "Driving time estimate:" %}
            <strong>
                {% if hours %}{{ hours }}h{% endif %}
                {% if mins %}
                    {{ mins }}min
                {% elif not hours %}
                    0min
                {% endif %}
            </strong>
            ({{ distance_km }} km)
        </span>
    </div>
{% endif %}
