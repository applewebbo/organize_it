{% load trip_tags i18n %}
<div class="flex justify-between items-center p-4 rounded-t border-b md:py-2.5 md:px-5 border-base-300">
    <h3 id="stay-title"
        class="text-xl font-semibold text-gray-900 dark:text-white">{{ stay.name }}</h3>
    <button type="button"
            class="btn btn-ghost btn-circle btn-sm"
            x-on:click="openModal = false{% if modified %}; location.reload(){% endif %}">
        <i class="ph-bold ph-x i-md"></i>
        <span class="sr-only">{% trans 'Close modal' %}</span>
    </button>
</div>
<div id="stay-details">
    <div class="relative">
        <div id="enrich-overlay"
             class="absolute inset-0 z-50 htmx-indicator bg-base-100/90">
            <div class="flex justify-center items-center w-full h-full">
                <span class="loading loading-bars loading-lg text-primary"></span>
            </div>
        </div>
        {% if error_message %}
            <div role="alert"
                 class="mx-4 mt-4 md:mx-5 alert alert-error alert-soft"
                 x-cloak
                 x-data="{ show: true }"
                 x-show="show"
                 x-init="setTimeout(() => show = false, 4000)">{{ error_message }}</div>
        {% elif success_message %}
            <div role="alert"
                 class="mx-4 mt-4 md:mx-5 alert alert-success alert-soft"
                 x-cloak
                 x-data="{ show: true }"
                 x-show="show"
                 x-init="setTimeout(() => show = false, 4000)">{{ success_message }}</div>
        {% endif %}
        <div class="grid grid-cols-2 gap-2 p-4 rounded-b sm:flex sm:justify-center md:p-5">
            {% if not stay.enriched %}
                <button type="button"
                        class="btn btn-secondary btn-soft"
                        hx-post="{% url 'trips:enrich-stay' stay.id %}"
                        hx-indicator="#enrich-overlay"
                        hx-swap="innerHTML"
                        hx-target="#dialog">
                    <i class="ph-bold ph-list-plus"></i>
                    <span>{% trans 'Enrich' %}</span>
                </button>
            {% endif %}
            <button type="button"
                    class="btn btn-success btn-soft"
                    hx-get="{% url 'trips:stay-modify' stay.pk %}"
                    hx-target="#stay-details"
                    hx-swap="innerHTML">
                <i class="ph-bold ph-pencil-line"></i>
                <span>{% trans 'Edit' %}</span>
            </button>
            <button type="button"
                    class="btn btn-error btn-soft"
                    hx-get="{% url 'trips:stay-delete' stay.pk %}"
                    hx-target="#stay-details"
                    hx-swap="innerHTML">
                <i class="ph-bold ph-trash"></i>
                <span>{% trans 'Delete' %}</span>
            </button>
            <button type="button"
                    x-on:click="openModal = false{% if modified %}; location.reload(){% endif %}"
                    class="btn btn-soft btn-neutral">
                <i class="ph-bold ph-x-circle"></i>
                <span>{% trans 'Close' %}</span>
            </button>
        </div>
    </div>
</div>
