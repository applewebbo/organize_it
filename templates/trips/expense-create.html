{% load crispy_forms_tags i18n %}
<form hx-post="{{ request.get_full_path }}"
      hx-target="#dialog"
      class="modal-content"
      method="post">
    <div class="border-base-300 flex items-center justify-between rounded-t border-b p-4 md:px-5 md:py-2.5">
        <h3 class="text-xl font-semibold">{% trans "Add expense" %}</h3>
        <button type="button"
                class="btn btn-sm btn-circle btn-ghost"
                x-on:click="openModal = false"
                aria-label="{% trans 'Close' %}">✕</button>
    </div>
    <div class="p-4 md:p-5">
        {% csrf_token %}
        {% if linked_object %}
            <div class="bg-base-200 mb-4 flex items-center gap-2 rounded-lg px-3 py-2 text-sm">
                <i class="ph ph-link text-primary"></i>
                <span>{% trans "Linked to" %} <strong>{{ linked_object.name|default:linked_object }}</strong></span>
            </div>
        {% endif %}
        {% crispy form %}
    </div>
    <div class="flex items-center justify-end p-4 md:p-5">
        <button type="button"
                x-on:click="openModal = false"
                class="btn btn-outline btn-error mr-2">{% trans "Cancel" %}</button>
        <button class="btn btn-primary" type="submit">{% trans "Save" %}</button>
    </div>
</form>
