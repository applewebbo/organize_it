{% load crispy_forms_tags i18n %}
<form hx-post="{{ request.get_full_path }}"
      hx-target="#dialog"
      class="modal-content"
      method="post">
    <div class="border-base-300 flex items-center justify-between rounded-t border-b p-4 md:px-5 md:py-2.5">
        <h3 class="text-xl font-semibold text-gray-900 dark:text-white">{% translate "Add expense" %}</h3>
        <button type="button"
                class="btn btn-sm btn-ghost btn-circle"
                x-on:click="openModal = false">
            <i class="ph-bold ph-x i-md"></i>
            <span class="sr-only">{% translate "Close" %}</span>
        </button>
    </div>
    <div class="p-4 md:p-5">
        {% csrf_token %}
        {% if linked_object %}
            <div class="bg-base-200 mb-4 flex items-center gap-2 rounded-lg px-3 py-2 text-sm">
                <i class="ph-bold ph-link text-primary"></i>
                <span>{% translate "Linked to" %} <strong>{{ linked_object.name|default:linked_object }}</strong></span>
            </div>
        {% endif %}
        <div class="grid gap-x-1 sm:grid-cols-6 sm:gap-x-2">{% crispy form %}</div>
    </div>
    <div class="flex items-center justify-end p-4 md:p-5">
        <button type="button"
                x-on:click="openModal = false"
                class="btn btn-outline btn-error mr-2">{% translate "Cancel" %}</button>
        <button class="btn btn-primary" type="submit">{% translate "Save" %}</button>
    </div>
</form>
