{% load i18n %}
<div class="modal-content">
    <div class="flex gap-2 justify-between items-center p-4 rounded-t border-b md:py-2.5 md:px-5 border-base-300">
        <h3 class="text-lg font-semibold truncate">{{ title }}</h3>
        <div class="flex gap-2 items-center shrink-0">
            <a class="btn btn-sm btn-primary"
               href="{% url 'trips:attachment-stream' attachment.pk %}"
               download="{{ attachment.original_name }}">
                <i class="ph-bold ph-download-simple" aria-hidden="true"></i>
                <span class="hidden sm:inline">{% trans "Download" %}</span>
            </a>
            <button type="button"
                    class="btn btn-sm btn-circle btn-ghost"
                    x-on:click="openModal = false"
                    aria-label="{% trans 'Close' %}">✕</button>
        </div>
    </div>
    <div class="p-4 md:p-5">
        {% if attachment.is_image %}
            <img src="{% url 'trips:attachment-stream' attachment.pk %}"
                 alt="{{ attachment.original_name }}"
                 class="mx-auto max-h-[70vh]">
        {% elif attachment.is_pdf %}
            <embed src="{% url 'trips:attachment-stream' attachment.pk %}"
                   type="application/pdf"
                   class="w-full h-[70vh]">
        {% endif %}
    </div>
</div>
