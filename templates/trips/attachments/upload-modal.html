{% load i18n %}
<form hx-post="{% url 'trips:attachment-upload' trip.pk category %}"
      hx-encoding="multipart/form-data"
      hx-swap="none"
      hx-on::after-request="if(event.detail.successful){ this.closest('[x-data]').dispatchEvent(new CustomEvent('hide-modal',{bubbles:true})); }"
      class="modal-content"
      method="post"
      enctype="multipart/form-data">
    {% csrf_token %}
    <div class="border-base-300 flex items-center justify-between rounded-t border-b p-4 md:px-5 md:py-2.5">
        <h3 class="text-xl font-semibold">{% translate "Add document" %}</h3>
        <button type="button"
                class="btn btn-sm btn-circle btn-ghost"
                x-on:click="openModal = false"
                aria-label="{% translate 'Close' %}"><i class="ph-bold ph-x i-md"></i></button>
    </div>
    <div class="space-y-4 p-4 md:p-5">
        <p class="text-base-content/70 text-sm">{% blocktranslate %}Allowed: PDF, JPEG, PNG, WEBP. Max 2 MB.{% endblocktranslate %}</p>
        {% if targets|length == 1 %}
            <input type="hidden" name="object_id" value="{{ targets.0.0 }}">
        {% else %}
            <label class="form-control w-full">
                <span class="label-text">{% translate "Attach to" %}</span>
                <select name="object_id" required class="select select-bordered w-full">
                    {% for pk, label in targets %}<option value="{{ pk }}">{{ label }}</option>{% endfor %}
                </select>
            </label>
        {% endif %}
        <label class="form-control w-full">
            <span class="label-text">{% translate "File" %}</span>
            <input type="file"
                   name="file"
                   accept="application/pdf,image/jpeg,image/png,image/webp"
                   required
                   class="file-input file-input-bordered w-full">
        </label>
        <div class="mt-4 flex justify-end gap-2">
            <button type="button" class="btn btn-ghost" x-on:click="openModal = false">{% translate "Cancel" %}</button>
            <button type="submit" class="btn btn-primary">{% translate "Upload" %}</button>
        </div>
    </div>
</form>
