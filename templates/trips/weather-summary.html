{% load i18n %}
{% if has_data %}
    {# Mobile: aggregate counts #}
    <div class="text-base-content mt-3 flex flex-wrap items-center gap-3 text-sm font-semibold sm:hidden">
        {% for icon, count in weather_counts.items %}
            <span class="flex items-center gap-1">
                <i class="ph-bold {{ icon }} text-base"></i>
                {{ count }}d
            </span>
        {% endfor %}
    </div>
    {# sm+: per-day icon + date #}
    <div class="text-base-content mt-3 hidden flex-wrap items-center gap-x-6 gap-y-1 text-sm font-semibold sm:flex">
        {% for entry in day_list %}
            <span class="flex items-center gap-1">
                <i class="ph-bold {{ entry.icon }} text-base"></i>
                {{ entry.date|date:"j/n" }}
            </span>
        {% endfor %}
    </div>
{% endif %}
