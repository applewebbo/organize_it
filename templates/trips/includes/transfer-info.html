{% load i18n trip_tags %}
<div id="transfer-info-{{ day_pk }}"
     class="text-base-content/80 bg-info/10 border-info/20 mx-auto mb-4 flex w-full max-w-sm flex-col items-center gap-1.5 rounded-xl border px-4 py-3 text-sm"
     {% if not transfer_duration %} hx-get="{% url 'trips:transfer-info' day_pk %}" hx-trigger="every 4s" hx-target="#transfer-info-{{ day_pk }}" hx-swap="outerHTML" {% endif %}>
    <div class="flex items-center gap-2 font-medium">
        <span class="truncate text-center">{{ from_dest }}</span>
        <i class="ph-bold ph-arrow-right text-info shrink-0" aria-hidden="true"></i>
        <span class="truncate text-center">{{ next_destination }}</span>
    </div>
    {% if transfer_duration %}
        <div class="flex items-center gap-4 text-xs opacity-80">
            <div class="flex items-center gap-1.5"
                 title="{% translate 'Estimated driving time' %}">
                <i class="ph-bold ph-car shrink-0" aria-hidden="true"></i>
                <span>~{{ transfer_duration|format_minutes }}</span>
            </div>
            <div class="flex items-center gap-1.5"
                 title="{% translate 'Estimated driving distance' %}">
                <i class="ph-bold ph-map-pin-line shrink-0" aria-hidden="true"></i>
                <span>~{{ transfer_distance }} km</span>
            </div>
        </div>
    {% else %}
        <span class="loading loading-spinner loading-xs mt-1"></span>
    {% endif %}
</div>
