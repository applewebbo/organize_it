{% load i18n %}
<div class="p-4 sm:p-6" x-data>
    <div class="mb-4 flex items-center justify-between">
        <h3 class="text-lg font-semibold">{% trans "Find a stay" %}</h3>
        <button class="btn btn-sm btn-ghost btn-circle"
                @click="$dispatch('hide-modal')"
                aria-label="{% trans 'Close' %}">
            <i class="ph-bold ph-x i-md"></i>
        </button>
    </div>
    <div class="text-base-content/70 mb-4 space-y-1 text-sm">
        <p>
            <i class="ph-bold ph-map-pin me-1"></i>{{ destination }}
        </p>
        <p>
            <i class="ph-bold ph-calendar-blank me-1"></i>{{ checkin|date:"j M Y" }} – {{ checkout|date:"j M Y" }}
        </p>
    </div>
    {% include "trips/includes/stay-booking-content.html" %}
</div>
