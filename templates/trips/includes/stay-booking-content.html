{% load i18n %}
<div id="stay-booking-content">
    <form hx-post="{% url 'trips:stay-booking-save' trip.pk %}"
          hx-target="#stay-booking-content"
          hx-swap="outerHTML"
          hx-trigger="change">
        {% csrf_token %}
        <input type="hidden" name="destination" value="{{ destination }}">
        <div class="bg-base-200 grid grid-cols-1 gap-4 rounded-lg p-4 sm:grid-cols-2 sm:gap-8">
            <div>
                <p class="text-base-content/70 mb-2 text-sm font-medium">{% translate "Who is travelling?" %}</p>
                <div class="space-y-1.5">
                    <label class="flex cursor-pointer items-center justify-between gap-2 text-sm">
                        <span class="flex items-center gap-2">
                            <input type="checkbox"
                                   name="includes_author"
                                   class="checkbox checkbox-sm"
                                   {% if includes_author %}checked{% endif %}>
                            {% translate "Me" %}
                        </span>
                        <span class="text-base-content/50 text-xs">{% translate "adult" %}</span>
                    </label>
                    {% for collab in collaborations %}
                        <label class="flex cursor-pointer items-center justify-between gap-2 text-sm">
                            <span class="flex items-center gap-2">
                                <input type="checkbox"
                                       name="participants"
                                       value="{{ collab.pk }}"
                                       class="checkbox checkbox-sm"
                                       {% if collab.pk in selected_ids %}checked{% endif %}>
                                {{ collab.display_name }}
                            </span>
                            {% if collab.is_child %}
                                <span class="text-base-content/50 flex items-center gap-1 text-xs">
                                    <i class="ph-bold ph-baby"></i>{{ collab.age }} {% translate "yrs" %}
                                </span>
                            {% else %}
                                <span class="text-base-content/50 text-xs">{% translate "adult" %}</span>
                            {% endif %}
                        </label>
                    {% endfor %}
                </div>
            </div>
            <label class="block">
                <span class="text-base-content/70 mb-1 block text-sm font-medium">{% translate "Booking provider" %}</span>
                <select name="provider" class="select select-bordered select-sm w-full">
                    {% for value, label in provider_choices %}
                        <option value="{{ value }}"
                                {% if value == booking.provider %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
                <span class="text-base-content/50 mt-1 flex items-start gap-1 text-xs">
                    <i class="ph-bold ph-info mt-0.5"></i>
                    {% translate "If the selected provider has no options for this destination, Stay22 routes you to an available one." %}
                </span>
            </label>
        </div>
    </form>
    <div class="mt-3 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <p class="text-base-content/70 text-sm">
            <i class="ph-bold ph-user me-1"></i>{{ booking.adults }} {% translate "adults" %}
            {% if booking.children %}· <i class="ph-bold ph-baby mx-1"></i>{{ booking.children }} {% translate "children" %}{% endif %}
        </p>
        <a href="{% url 'trips:stay-booking-redirect' trip.pk %}?destination={{ destination|urlencode }}"
           target="_blank"
           rel="noopener noreferrer"
           class="btn btn-primary max-sm:w-full">
            {% translate "Search on Stay22" %}<i class="ph-bold ph-arrow-square-out"></i>
        </a>
    </div>
</div>
