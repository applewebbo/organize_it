{% if tags %}
    <div class="mt-1 mb-2 px-2">
        <ul>
            {% for tag in tags %}
                <li class="mb-1 flex items-center justify-between gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-1 text-sm text-slate-600">
                    <span>{{ tag|capfirst }}</span>
                    <button type="button"
                            class="btn btn-xs btn-ghost"
                            @click="setTag('{{ tag }}')">
                        <i class="ph-bold ph-plus-circle i-sm"></i>
                    </button>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endif %}
