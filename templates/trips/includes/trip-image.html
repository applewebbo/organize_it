{% load static %}
{% if trip.image_metadata.pending %}
    <div id="trip-image-{{ trip.pk }}"
         class="flex justify-center items-center w-full h-full bg-base-200"
         hx-get="{% url 'trips:trip-image-status' trip.pk %}"
         hx-trigger="every 3s"
         hx-target="this"
         hx-swap="outerHTML">
        <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
{% elif trip.get_image_url %}
    <img src="{{ trip.get_image_url }}"
         alt="{{ trip.title }}"
         class="object-cover w-full h-full"
         loading="{{ image_loading|default:'lazy' }}">
{% else %}
    <img src="{% static image_placeholder|default:'img/trip_generic.jpg' %}"
         alt="{{ trip.title }}"
         class="object-cover w-full h-full"
         loading="{{ image_loading|default:'lazy' }}">
{% endif %}
