{% load i18n l10n %}
{% if found %}
    <div class="mt-2 mb-2">
        <ul>
            {% for city in cities %}
                <li class="mx-2 mb-2 flex items-center justify-between gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-600">
                    <div>
                        <span class="font-bold">{{ city.name }}</span>&nbsp;<span class="text-base-content/50 text-xs">{{ city.country }}</span>
                    </div>
                    <button type="button"
                            class="btn btn-xs btn-ghost"
                            @click="selectCity('{{ city.name|escapejs }}', '{{ city.lat|unlocalize }}', '{{ city.lon|unlocalize }}')">
                        <i class="ph-bold ph-plus-circle i-sm"></i>
                    </button>
                </li>
            {% endfor %}
        </ul>
        <p class="mx-2 my-1 flex items-center justify-end gap-1 px-3 text-xs text-slate-400 italic">
            <i class="ph-bold ph-info i-xs"></i>{% translate 'Search conducted via' %}&nbsp;<a href="https://nominatim.openstreetmap.org/ui/search.html"
   class="link link-primary">Nominatim API</a>
        </p>
    </div>
{% elif found is False %}
    <div class="mt-2 mb-2">
        <p class="mx-2 mb-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-red-500">
            {% translate 'No city found.' %}
        </p>
    </div>
{% endif %}
