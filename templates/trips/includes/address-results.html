{% load i18n %}
{% if found %}
    <div class="-mt-1 mb-4">
        <ul>
            {% for address in addresses %}
                <li class="mx-2 mb-2 flex items-center justify-between gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-600">
                    <div>
                        <span id="name-{{ forloop.counter }}" class="font-bold">{{ address.name }}</span>&nbsp;<span id="address-{{ forloop.counter }}">{{ address.address }}</span>
                    </div>
                    <button type="button"
                            class="btn btn-xs btn-ghost"
                            @click="setFields('name-{{ forloop.counter }}', 'address-{{ forloop.counter }}')">
                        <i class="ph-bold ph-plus-circle i-sm"></i>
                    </button>
                </li>
            {% endfor %}
        </ul>
        <p class="mx-2 my-1 flex items-center justify-end gap-1 px-3 text-xs text-slate-400 italic">
            <i class="ph-bold ph-info i-xs"></i>{% trans 'Search conducted via' %}&nbsp;<a href="https://nominatim.openstreetmap.org/ui/search.html"
   class="link link-primary">Nominatim API</a>
        </p>
    </div>
{% else %}
    <div class="-mt-1 mb-4">
        <p class="mx-2 mb-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-red-500">
            {% trans 'No address found.' %}
        </p>
        <p class="mx-2 my-1 flex items-center justify-end gap-1 px-3 text-xs text-slate-400 italic">
            <i class="ph-bold ph-info i-xs"></i>{% trans 'Search conducted via' %}&nbsp;<a href="https://nominatim.openstreetmap.org/ui/search.html"
   class="link link-primary">Nominatim API</a>
        </p>
    </div>
{% endif %}
