{% load static %}
{% if trip.image_metadata.pending %}
    <div id="trip-image-{{ trip.pk }}"
         class="bg-base-200 flex h-full w-full items-center justify-center"
         hx-get="{% url 'trips:trip-image-status' trip.pk %}"
         hx-trigger="every 3s"
         hx-target="this"
         hx-swap="outerHTML">
        <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
{% else %}
    <img id="trip-image-{{ trip.pk }}"
         src="{{ trip.get_image_url|default:'' }}"
         alt="{{ trip.title }}"
         class="h-full w-full object-cover"
         loading="lazy">
{% endif %}
