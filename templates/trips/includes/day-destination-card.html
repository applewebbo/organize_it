{% load i18n %}
<div class="border-base-300 bg-base-50 flex items-center gap-3 rounded-lg border p-3"
     id="day-destination-{{ day.pk }}">
    <div class="bg-primary/10 flex h-10 w-10 shrink-0 flex-col items-center justify-center rounded-full">
        <span class="text-primary text-xs font-bold">{{ day.number }}</span>
        <span class="text-primary/70 text-xs leading-none">{% trans "Day" %}</span>
    </div>
    <div class="flex min-w-0 flex-1 flex-col">
        <span class="text-base-content/50 text-xs">{{ day.date|date:"D, d M" }}</span>
        <form hx-post="{% url 'trips:update-day-destination' trip.pk day.pk %}"
              hx-target="#day-destination-{{ day.pk }}"
              hx-swap="outerHTML"
              class="mt-1 flex items-center gap-2">
            {% csrf_token %}
            <input type="text"
                   name="destination"
                   value="{{ day.destination }}"
                   placeholder="{{ trip.destination }}"
                   class="input input-sm input-bordered w-full"
                   aria-label="{% trans 'Destination for day' %} {{ day.number }}">
            <button type="submit"
                    class="btn btn-sm btn-primary btn-square"
                    aria-label="{% trans 'Save' %}">
                <i class="ph-bold ph-check i-sm"></i>
            </button>
        </form>
    </div>
    {% if day.destination %}
        <i class="ph-bold ph-map-pin text-primary i-sm shrink-0"
           aria-hidden="true"></i>
    {% else %}
        <i class="ph-bold ph-map-pin text-base-content/20 i-sm shrink-0"
           aria-hidden="true"></i>
    {% endif %}
</div>
