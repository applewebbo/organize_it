{% load i18n %}
{% if found_user %}
    {% if already_collab %}
        <p class="text-sm text-base-content/60">{% trans "Already a collaborator." %}</p>
    {% else %}
        <div class="flex gap-2 items-center p-2 rounded-lg bg-base-200">
            <span class="text-sm grow">{{ found_user.email }}</span>
            <form method="post"
                  action="{% url 'trips:add-collaborator' trip.pk %}"
                  hx-post="{% url 'trips:add-collaborator' trip.pk %}"
                  hx-target="#collaborators-section"
                  hx-swap="outerHTML">
                {% csrf_token %}
                <input type="hidden" name="email" value="{{ found_user.email }}">
                <button type="submit" class="btn btn-sm btn-primary">{% trans "Add" %}</button>
            </form>
        </div>
    {% endif %}
{% elif email %}
    <div class="flex gap-2 items-center p-2 text-sm rounded-lg bg-base-200">
        <i class="ph-bold ph-user-circle-dashed text-base-content/60 i-md"></i>
        <span class="text-base-content/60 grow">{% trans "No account found." %}</span>
        <button class="btn btn-sm btn-soft"
                hx-get="{% url 'trips:add-collaborator' trip.pk %}"
                hx-target="#dialog"
                hx-swap="innerHTML"
                @click="$dispatch('open-modal')"
                disabled>{% trans "Invite by email" %}</button>
    </div>
{% endif %}
