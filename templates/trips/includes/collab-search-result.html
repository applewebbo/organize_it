{% load i18n %}
{% if results %}
    {% for result in results %}
        <div class="flex gap-2 items-center p-2 rounded-lg bg-base-200 {% if not forloop.first %}mt-2{% endif %}">
            <span class="grow text-sm">{{ result.user.email }}</span>
            {% if result.already_collab %}
                <span class="text-base-content/60 text-xs">{% translate "Already a participant." %}</span>
            {% else %}
                <form method="post"
                      action="{% url 'trips:add-collaborator' trip.pk %}"
                      hx-post="{% url 'trips:add-collaborator' trip.pk %}"
                      hx-target="#collab-modal-list"
                      hx-swap="outerHTML">
                    {% csrf_token %}
                    <input type="hidden" name="email" value="{{ result.user.email }}">
                    <input type="hidden" name="can_edit" value="true">
                    <button type="submit" class="btn btn-sm btn-primary">{% translate "Add" %}</button>
                </form>
            {% endif %}
        </div>
    {% endfor %}
{% elif email %}
    <div class="bg-base-200 flex items-center gap-2 rounded-lg p-2 text-sm">
        <i class="ph-bold ph-user-circle-dashed text-base-content/60 i-md"></i>
        <span class="text-base-content/60 grow">{% translate "No account found." %}</span>
        <form method="post"
              action="{% url 'trips:invite-collaborator' trip.pk %}"
              hx-post="{% url 'trips:invite-collaborator' trip.pk %}"
              hx-target="#collab-search-result"
              hx-swap="outerHTML">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">
            <button type="submit" class="btn btn-sm btn-soft">{% translate "Invite by email" %}</button>
        </form>
    </div>
{% endif %}
