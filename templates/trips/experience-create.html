{% load crispy_forms_tags i18n %}
<form hx-post="{{ request.path }}"
      hx-target="#dialog"
      hx-disabled-elt="#form-submit"
      class="modal-content"
      method="post"
      x-data="autocompleteForm()">
    <div class="flex justify-between items-center p-4 rounded-t border-b md:py-2.5 md:px-5 border-base-300">
        <h3 class="text-xl font-semibold text-gray-900 dark:text-white">{% trans 'Create a new Experience' %}</h3>
        <button type="button"
                class="inline-flex justify-center items-center w-8 h-8 text-sm text-gray-400 bg-transparent rounded-lg hover:text-gray-900 hover:bg-gray-200 ms-auto dark:hover:bg-gray-600 dark:hover:text-white"
                x-on:click="openModal = false">
            <i class="ph-bold ph-x i-md"></i>
            <span class="sr-only">Close modal</span>
        </button>
    </div>
    <div class="grid gap-x-1 p-4 sm:grid-cols-4 sm:gap-x-2 md:p-5">
        {% csrf_token %}
        <div class="px-4 pt-3 pb-6 mb-5 rounded-lg border sm:col-span-4 bg-base-200 border-base-300">
            <label for="id_maps_link" class="block mb-1 text-sm font-medium">{% trans "Google Maps" %}</label>
            <div class="flex gap-2">
                <input type="text"
                       id="id_maps_link"
                       name="maps_link"
                       class="flex-1 input input-bordered input-sm"
                       placeholder="{% trans 'Paste a Google Maps link to auto-fill' %}">
                <button type="button"
                        class="btn btn-sm btn-primary"
                        hx-post="{% url 'trips:resolve-maps-link' %}"
                        hx-target="#maps-link-results"
                        hx-include="[name='maps_link']">{% trans "Search" %}</button>
            </div>
            <div id="maps-link-results"></div>
        </div>
        {% crispy form %}
    </div>
    {% if unpaired_experiences %}
        <div class="px-4 md:px-5">
            <h4 class="text-lg font-semibold">{% trans 'Unpaired Experiences' %}</h4>
            <ul class="flex flex-wrap gap-3 justify-start items-center mt-4">
                {% for exp in unpaired_experiences %}
                    <li>
                        <a href="{% url 'trips:event-pair' exp.pk day.pk %}"
                           class="flex gap-2 items-center btn btn-primary btn-soft"
                           hx-get="{% url 'trips:event-pair' exp.pk day.pk %}"
                           hx-target="#dialog">
                            {{ exp.name }}
                            <i class="ph-bold ph-plus-circle i-sm"></i>
                        </a>
                    </li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}
    <div class="flex justify-end items-center p-4 md:p-5">
        <button type="button"
                x-on:click="openModal = false"
                class="mr-2 btn btn-outline btn-error">{% trans 'Cancel' %}</button>
        <button id="form-submit" class="btn btn-outline btn-primary" type="submit">{% trans 'Save' %}</button>
    </div>
</form>
