{% load i18n %}
<div x-data="{ currentStep: 'type', transportType: '{{ transport_type }}' }">
    <!-- Header -->
    <div class="border-base-300 flex items-center justify-between rounded-t border-b p-4 md:px-5 md:py-2.5">
        <h3 class="text-xl font-semibold text-gray-900 dark:text-white">{% translate "Add Arrival Transfer" %}</h3>
        <button type="button"
                class="ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white"
                x-on:click="openModal = false">
            <svg class="h-3 w-3"
                 aria-hidden="true"
                 xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
            </svg>
            <span class="sr-only">{% translate "Close modal" %}</span>
        </button>
    </div>
    <!-- Progress indicator -->
    <div class="border-base-200 border-b p-4">
        <ul class="steps steps-horizontal w-full">
            <li class="step" :class="{ 'step-primary': currentStep !== 'type' }">{% translate "Type" %}</li>
            <li class="step" :class="{ 'step-primary': currentStep === 'form' }">{% translate "Details" %}</li>
        </ul>
    </div>
    <!-- Modal content (swapped by HTMX) -->
    <div id="arrival-transfer-content"
         hx-get="{% url 'trips:main-transfer-step' trip.pk %}?step=type&direction=arrival&transport_type={{ transport_type }}"
         hx-trigger="load"
         hx-swap="innerHTML">
        <!-- Step content will be loaded here -->
    </div>
</div>
