{% load crispy_forms_tags i18n %}
<form hx-post="{{ request.path }}"
      hx-target="#dialog"
      hx-disabled-elt="#form-submit"
      class="modal-content"
      method="post"
      x-data="autocompleteForm()">
    <div class="border-base-300 flex items-center justify-between rounded-t border-b p-4 md:px-5 md:py-2.5">
        <h3 class="text-xl font-semibold text-gray-900 dark:text-white">{% translate 'Create a new Meal' %}</h3>
        <button type="button"
                class="ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white"
                x-on:click="openModal = false">
            <svg class="h-3 w-3"
                 aria-hidden="true"
                 xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
            </svg>
            <span class="sr-only">Close modal</span>
        </button>
    </div>
    <div class="grid gap-x-1 p-4 sm:grid-cols-4 sm:gap-x-2 md:p-5">
        {% csrf_token %}
        <div class="bg-base-200 border-base-300 mb-5 rounded-lg border px-4 pt-3 pb-6 sm:col-span-4">
            <label for="id_maps_link" class="mb-1 block text-sm font-medium">{% translate "Google Maps" %}</label>
            <div class="flex gap-2">
                <input type="text"
                       id="id_maps_link"
                       name="maps_link"
                       class="input input-bordered input-sm flex-1"
                       placeholder="{% translate 'Paste a Google Maps link to auto-fill' %}">
                <button type="button"
                        class="btn btn-sm btn-primary"
                        hx-post="{% url 'trips:resolve-maps-link' %}"
                        hx-target="#maps-link-results"
                        hx-include="[name='maps_link']"
                        hx-vals='{"form_type": "meal"}'>{% translate "Search" %}</button>
            </div>
            <div id="maps-link-results"></div>
        </div>
        {% crispy form %}
    </div>
    {% if unpaired_experiences %}
        <div class="px-4 md:px-5">
            <h4 class="text-lg font-semibold">{% translate 'Unpaired Meals' %}</h4>
            <ul class="mt-4 flex flex-wrap items-center justify-start gap-3">
                {% for exp in unpaired_experiences %}
                    <li>
                        <a href="{% url 'trips:event-pair' exp.pk day.pk %}"
                           class="btn btn-primary btn-soft flex items-center gap-2"
                           hx-get="{% url 'trips:event-pair' exp.pk day.pk %}"
                           hx-target="#dialog">
                            {{ exp.name }}
                            <i class="ph-bold ph-plus-circle i-sm"></i>
                        </a>
                    </li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}
    <div class="flex items-center justify-end p-4 md:p-5">
        <button type="button"
                x-on:click="openModal = false"
                class="btn btn-outline btn-error mr-2">Cancel</button>
        <button id="form-submit" class="btn btn-outline btn-primary" type="submit">Save</button>
    </div>
</form>
