{% load i18n %}
<div id="wizard-content" class="mx-auto max-w-2xl">
    {% include "trips/wizard/steps-indicator.html" with step=3 %}
    <div class="card bg-base-100 border-base-300 mt-6 border shadow-sm">
        <div class="card-body items-center text-center">
            <i class="ph-bold ph-check-circle i-lg text-success" aria-hidden="true"></i>
            <h2 class="card-title">{% translate "Itinerary added" %}</h2>
            <p class="text-base-content/70 text-sm">
                {% translate "The days you kept were added to your trip. You can refine each day later." %}
            </p>
            <a href="{% url 'trips:trip-detail' trip.pk %}"
               class="btn btn-primary mt-4">{% translate "Go to trip" %}</a>
        </div>
    </div>
</div>
