{% load i18n trip_tags %}
<div class="border-base-300 flex items-center justify-between rounded-t border-b p-4 md:px-5 md:py-2.5">
    <h3 class="text-lg font-semibold">{% translate "Move to day" %} — {{ event.name|truncatechars:28 }}</h3>
    <button type="button"
            class="btn btn-sm btn-ghost btn-circle"
            x-on:click="openModal = false">
        <i class="ph-bold ph-x i-md"></i>
        <span class="sr-only">{% translate "Close" %}</span>
    </button>
</div>
<div class="p-4 md:p-5">
    <div class="flex flex-wrap gap-2">
        {% for day in days %}
            <button class="btn btn-sm btn-soft"
                    hx-post="{% url 'trips:move-event-to-day' event.pk day.pk %}"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    @click="openModal = false">
                {% if day.date %}{{ day.date|date:"j M" }} —{% endif %}
                {% translate "Day" %} {{ day.number }}
                {% if day.destination %}<span class="ms-1 text-xs opacity-60">{{ day.destination }}</span>{% endif %}
            </button>
        {% empty %}
            <p class="text-base-content/50 text-sm">{% translate "No other days available." %}</p>
        {% endfor %}
    </div>
</div>
