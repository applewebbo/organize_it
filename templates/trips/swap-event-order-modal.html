{% load i18n trip_tags %}
<div class="border-base-300 flex items-center justify-between rounded-t border-b p-4 md:px-5 md:py-2.5">
    <h3 class="text-lg font-semibold">{% trans "Move" %} {{ event.name|truncatechars:28 }}</h3>
    <button type="button"
            class="ms-auto inline-flex h-8 w-8 items-center justify-center rounded-lg bg-transparent text-sm text-gray-400 hover:bg-gray-200 hover:text-gray-900 dark:hover:bg-gray-600 dark:hover:text-white"
            x-on:click="openModal = false">
        <svg class="h-3 w-3"
             aria-hidden="true"
             xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
        </svg>
        <span class="sr-only">{% trans "Close" %}</span>
    </button>
</div>
<div class="p-4 md:p-5">
    <div class="flex flex-wrap gap-2">
        {% for other in other_events %}
            <button class="btn btn-sm border {{ other|event_border_color }} {{ other|event_bg_color }} {{ other|event_icon_color }} hover:opacity-80"
                    hx-post="{% url 'trips:swap-event-order' event.pk %}"
                    hx-vals='{"other_event_id": "{{ other.pk }}"}'
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    @click="openModal = false">{{ other.name|truncatechars:28 }}</button>
        {% endfor %}
    </div>
</div>
