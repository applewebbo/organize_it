{% load i18n static %}
<div class="flex flex-col items-center justify-center px-4 py-16 text-center">
    <!-- Illustrative Icon -->
    <div class="mb-6">
        <img src="{% static 'img/worldwide.png' %}"
             alt="{% translate 'Travel illustration' %}"
             class="h-32 w-32 md:h-40 md:w-40">
    </div>
    <!-- Welcoming Headline -->
    <h1 class="text-base-content mb-4 text-3xl font-bold tracking-tight md:text-4xl">
        {% translate "Ready for your next adventure?" %}
    </h1>
    <!-- Encouraging Subtext -->
    <p class="text-base-content/70 mb-8 max-w-xl text-lg md:text-xl">
        {% translate "Start planning your perfect trip. Organize stays, experiences, meals and transfers all in one place." %}
    </p>
    <!-- Prominent CTA Button -->
    <button x-data
            hx-get="{% url 'trips:trip-create' %}?next=list"
            hx-target="#dialog"
            hx-swap="innerHTML"
            @click="$dispatch('open-modal')"
            class="btn btn-primary btn-lg gap-2">
        <i class="ph-bold ph-plus-circle i-lg" aria-hidden="true"></i>
        <span>{% translate "Create Your First Trip" %}</span>
    </button>
</div>
