name: Deploy Docs to Codeberg Pages

on:
  push:
    branches:
    - main
    paths:
    - docs/**
    - mkdocs.yml
    - mkdocs-it.yml
    - .forgejo/workflows/docs.yml

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: https://code.forgejo.org/actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: https://code.forgejo.org/actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: pip install -r docs/requirements.txt

    - name: Build EN docs
      run: mkdocs build -f mkdocs.yml -d site-en

    - name: Build IT docs
      run: mkdocs build -f mkdocs-it.yml -d site-it

    - name: Assemble pages
      run: |
        mkdir -p pages/en pages/it
        cp -r site-en/. pages/en/
        cp -r site-it/. pages/it/
        cat > pages/index.html <<'EOF'
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=en/">
          <link rel="canonical" href="en/">
        </head>
        <body>
          <p>Redirecting to <a href="en/">English docs</a>...</p>
        </body>
        </html>
        EOF

    - name: Deploy to pages branch
      run: |
        git config user.name "Forgejo Actions"
        git config user.email "actions@forgejo"
        git remote set-url origin https://oauth2:${{ secrets.FORGEJO_TOKEN }}@codeberg.org/webbografico/organize_it.git
        git checkout --orphan pages-deploy
        git rm -rf . --quiet
        cp -r pages/. .
        git add .
        git commit -m "docs: deploy to Codeberg Pages"
        git push --force origin HEAD:pages
